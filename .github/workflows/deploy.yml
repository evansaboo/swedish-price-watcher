name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook on Pi
        run: |
          echo "Triggering deploy on Pi via webhook..."
          if [ -z "${{ secrets.DEPLOY_SECRET }}" ]; then
            echo "❌ GitHub secret DEPLOY_SECRET is empty/unset. Set it with: gh secret set DEPLOY_SECRET"
            exit 1
          fi
          # Capture body + status separately (do NOT use -f, which hides the body on 4xx/5xx).
          # No request body is sent, so don't set Content-Type: application/json (Fastify would 400 on empty body).
          # Secret goes in a header, not the URL, so it never lands in proxy/access logs.
          HTTP_CODE=$(curl -s -o /tmp/deploy_body.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_SECRET }}" \
            "https://deals.evansaboo.com/api/deploy" \
            --max-time 15)
          echo "HTTP $HTTP_CODE"
          echo "Response: $(cat /tmp/deploy_body.txt)"
          case "$HTTP_CODE" in
            2*) echo "✅ Webhook accepted." ;;
            401) echo "❌ 401 Unauthorized: the GitHub DEPLOY_SECRET does not match the Pi's DEPLOY_SECRET env var."; exit 1 ;;
            501) echo "❌ 501: DEPLOY_SECRET is not configured on the Pi."; exit 1 ;;
            *)   echo "❌ Unexpected HTTP $HTTP_CODE from deploy webhook."; exit 1 ;;
          esac

      - name: Wait for the Pi to come back on this commit
        run: |
          # /health reports the commit the running process started from, so this
          # only passes once the *restarted* app is up (the old process keeps
          # answering while the Pi pulls and installs). Startup can take a few
          # minutes on the Pi, hence the 5-minute budget.
          echo "Waiting for the Pi to pull, restart and report ${GITHUB_SHA}..."
          for i in $(seq 1 60); do
            sleep 5
            BODY=$(curl -s --max-time 5 https://deals.evansaboo.com/health 2>/dev/null || true)
            if echo "$BODY" | grep -q "\"sha\":\"${GITHUB_SHA}\""; then
              echo "✅ Deploy successful: ${GITHUB_SHA} is live after ~$((i * 5))s"
              exit 0
            fi
            echo "Waiting... ($i/60) ${BODY:-no response}"
          done
          echo "❌ ${GITHUB_SHA} was not live and healthy after 300s"
          exit 1
