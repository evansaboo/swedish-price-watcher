<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bodyGrad_4070s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24252a"/>
      <stop offset="40%" stop-color="#18191d"/>
      <stop offset="100%" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4d56"/>
      <stop offset="50%" stop-color="#282a30"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Card Shroud -->
  <rect x="8" y="8" width="144" height="144" rx="16" fill="url(#bodyGrad_4070s)" stroke="url(#metalRim)" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Heat Fin Louvers Background Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.2">
    <line x1="20" y1="36" x2="140" y2="36" />
    <line x1="20" y1="42" x2="140" y2="42" />
    <line x1="20" y1="48" x2="140" y2="48" />
    <line x1="20" y1="54" x2="140" y2="54" />
    <line x1="20" y1="108" x2="140" y2="108" />
    <line x1="20" y1="114" x2="140" y2="114" />
    <line x1="20" y1="120" x2="140" y2="120" />
    <line x1="20" y1="126" x2="140" y2="126" />
  </g>

  <!-- NVIDIA Green Accent Bar -->
  <rect x="20" y="20" width="120" height="3.5" rx="1.75" fill="url(#glowGrad)" />

  <!-- Founders Edition Hourglass Silhouette Ring -->
  <circle cx="80" cy="80" r="42" fill="none" stroke="#2c2e35" stroke-width="6" stroke-dasharray="16 4" opacity="0.6"/>
  <circle cx="80" cy="80" r="32" fill="#121316" stroke="#363840" stroke-width="1.5"/>

  <!-- GEFORCE RTX Subtitle -->
  <text x="80" y="32" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.8" text-anchor="middle">GEFORCE RTX</text>

  <!-- Model Number -->
  <text x="80" y="85" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="0.5" text-anchor="middle">4070 SUPER</text>

  <!-- Founders Edition Tag -->
  <rect x="36" y="100" width="88" height="15" rx="7.5" fill="#1b2412" stroke="#76b900" stroke-width="0.8" />
  <text x="80" y="110.5" fill="#a3e635" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="6.5" font-weight="700" letter-spacing="1" text-anchor="middle">FOUNDERS EDITION</text>

  <!-- Fan Hub Accent Dot -->
  <circle cx="80" cy="80" r="2" fill="#76b900" opacity="0.9"/>
</svg>